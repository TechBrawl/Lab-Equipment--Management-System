<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabOS Manager - Edit Equipment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-light-core: #f8fafc; 
            --bg-card: rgba(255, 255, 255, 0.85); 
            --border-glass: rgba(226, 232, 240, 0.8); 
            --accent-primary: #4f46e5; 
            --text-main: #1e293b; 
            --text-muted: #64748b; 
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-light-core);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .form-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(148, 163, 184, 0.12);
            width: 100%;
            max-width: 540px;
            padding: 2.5rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-primary) !important;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
        }
    </style>
</head>
<body>

    <div class="form-panel">
        
        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-light">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-3 p-2 bg-success bg-opacity-10 text-success d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; font-size: 1.2rem;">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h1 class="h4 fw-bold text-dark m-0">Modify Asset Schema</h1>
                    <p class="text-muted small m-0">Updating parameters for node: {{ asset.equipment_id }}</p>
                </div>
            </div>
            <a href="{% url 'home' %}" class="btn-close" aria-label="Back to Dashboard" title="Back to Dashboard"></a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show small p-2.5 mb-4 shadow-sm" role="alert">
                    <i class="bi bi-info-circle-fill me-1"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-with-dismiss="alert" aria-label="Close" style="padding: 0.85rem;"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'edit_equipment' asset.id %}" method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="equipmentIdInput" class="form-label small fw-bold text-dark text-uppercase tracking-wider" style="font-size: 11px;">Equipment Serial / ID Reference</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-tag"></i></span>
                    <input type="text" name="equipment_id" id="equipmentIdInput" class="form-control bg-white border-start-0 text-dark" value="{{ asset.equipment_id }}" required style="border-color: #cbd5e1;">
                </div>
                <div class="form-text text-muted mt-1" style="font-size: 11px;">Altering serial mappings might affect historic check-out transaction keys.</div>
            </div>

            <div class="mb-4">
                <label for="equipmentNameInput" class="form-label small fw-bold text-dark text-uppercase tracking-wider" style="font-size: 11px;">Equipment Nomenclature Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-info-circle"></i></span>
                    <input type="text" name="name" id="equipmentNameInput" class="form-control bg-white border-start-0 text-dark" value="{{ asset.name }}" required style="border-color: #cbd5e1;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark text-uppercase tracking-wider" style="font-size: 11px;">Category Assignment</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-grid-fill"></i></span>
                    <select name="category" class="form-select bg-white border-start-0 text-dark" required style="border-color: #cbd5e1;">
                        <option value="ELECTRONICS" {% if asset.category == 'ELECTRONICS' %}selected{% endif %}>Electronics & Electrical</option>
                        <option value="IT_COMPUTERS" {% if asset.category == 'IT_COMPUTERS' %}selected{% endif %}>IT & Computers</option>
                        <option value="MECHANICAL" {% if asset.category == 'MECHANICAL' %}selected{% endif %}>Mechanical Tools</option>
                        <option value="CHEMISTRY" {% if asset.category == 'CHEMISTRY' %}selected{% endif %}>Chemistry & Glassware</option>
                        <option value="GENERAL" {% if asset.category == 'GENERAL' %}selected{% endif %}>General Accessories</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark text-uppercase tracking-wider" style="font-size: 11px;">Lab Allocation</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-geo-alt-fill"></i></span>
                    <select name="lab_allocation" class="form-select bg-white border-start-0 text-dark" required style="border-color: #cbd5e1;">
                        <option value="MAIN_LAB" {% if asset.lab_allocation == 'MAIN_LAB' %}selected{% endif %}>Main Laboratory</option>
                        <option value="PHYSICS_LAB" {% if asset.lab_allocation == 'PHYSICS_LAB' %}selected{% endif %}>Physics Lab</option>
                        <option value="CHEM_LAB" {% if asset.lab_allocation == 'CHEM_LAB' %}selected{% endif %}>Chemistry Lab</option>
                        <option value="COMPUTER_LAB" {% if asset.lab_allocation == 'COMPUTER_LAB' %}selected{% endif %}>Computer Lab</option>
                        <option value="STORAGE" {% if asset.lab_allocation == 'STORAGE' %}selected{% endif %}>Storage Facility</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark text-uppercase tracking-wider" style="font-size: 11px;">Status Flag</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-flag-fill"></i></span>
                    <select name="status_flag" class="form-select bg-white border-start-0 text-dark" required style="border-color: #cbd5e1;">
                        <option value="OPERATIONAL" {% if asset.status_flag == 'OPERATIONAL' %}selected{% endif %}>Operational</option>
                        <option value="MAINTENANCE" {% if asset.status_flag == 'MAINTENANCE' %}selected{% endif %}>Under Maintenance</option>
                        <option value="DECOMMISSIONED" {% if asset.status_flag == 'DECOMMISSIONED' %}selected{% endif %}>Decommissioned</option>
                    </select>
                </div>
            </div>

            <div class="form-check form-switch p-0 ps-5 my-4">
                <input class="form-check-input ms--5" type="checkbox" role="switch" name="is_active" id="isActiveToggle" {% if asset.is_active %}checked{% endif %} style="width: 2.5em; height: 1.25em; cursor: pointer;">
                <label class="form-check-label small text-dark fw-semibold user-select-none pt-1" for="isActiveToggle" style="cursor: pointer;">
                    Flag as Active in Core Database
                </label>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top border-light mt-4">
                <a href="{% url 'home' %}" class="btn btn-sm btn-outline-secondary px-4 py-2 fw-medium rounded-2">Cancel</a>
                <button type="submit" class="btn btn-sm btn-primary px-4 py-2 fw-bold shadow-sm rounded-2" style="background-color: var(--accent-primary); border:none;">
    <i class="bi bi-cloud-arrow-up me-1"></i> Update Properties
</button>
            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
