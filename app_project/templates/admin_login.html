<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabOS - Secure Staff Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-light-core: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-glass: rgba(226, 232, 240, 0.8);
            --accent-primary: #4f46e5;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-light-core);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(148, 163, 184, 0.18);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            transition: var(--transition-smooth);
        }

        .role-toggle-container {
            background-color: #e2e8f0;
            padding: 4px;
            border-radius: 10px;
            display: flex;
            gap: 4px;
        }

        .role-radio {
            display: none;
        }

        .role-label {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-smooth);
            user-select: none;
        }

        .role-radio:checked + .role-label {
            background-color: #ffffff;
            color: var(--accent-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.25rem auto;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        
        <div class="text-center">
            <div class="brand-icon">
                <i class="bi bi-palette2"></i>
            </div>
            <h1 class="h4 fw-bold text-dark m-0">LabOS Terminal</h1>
            <p class="text-muted small mt-1 mb-4">Institutional Asset Verification Gate</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show p-2 mb-4 text-center small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.75rem;"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label d-block small fw-bold text-secondary text-uppercase tracking-wider mb-2" style="font-size: 11px;">Clearance Domain</label>
                <div class="role-toggle-container">
                    
                    <input type="radio" name="userRole" id="roleAssistant" class="role-radio" value="ASSISTANT" checked>
                    <label for="roleAssistant" class="role-label">
                        <i class="bi bi-person me-1"></i> Lab Assistant
                    </label>

                    <input type="radio" name="userRole" id="roleAdmin" class="role-radio" value="ADMIN">
                    <label for="roleAdmin" class="role-label">
                        <i class="bi bi-shield-lock me-1"></i> System Admin
                    </label>
                    
                </div>
            </div>

            <div class="mb-3">
                <label for="emailInput" class="form-label small fw-semibold text-dark">Staff Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" id="emailInput" class="form-control bg-white border-start-0 text-dark" placeholder="username@university.com" required style="border-color: #cbd5e1;">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="passwordInput" class="form-label small fw-semibold text-dark m-0">Account Password</label>
                    <a href="#" class="small text-decoration-none text-muted" style="font-size: 12px;">Forgot?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted" style="border-color: #cbd5e1;"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control bg-white border-start-0 text-dark" placeholder="••••••••" required style="border-color: #cbd5e1;">
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
                <label class="form-check-label small text-muted user-select-none" for="rememberMe">
                    Trust this local workstation node
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm fw-semibold mb-3" style="background-color: var(--accent-primary); border:none;">
                <i class="bi bi-box-arrow-in-right me-1"></i> Authorize Secure Sign-In
            </button>

            <div class="text-center rounded-3 p-2 bg-light border" style="font-size: 11px; color: var(--text-muted);">
                <i class="bi bi-info-circle-fill text-primary me-1"></i> Self-signup is locked. Admins control staff accounts.
            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
